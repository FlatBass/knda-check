spring.application.name=knda-check
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.schemas=knda_check
spring.flyway.default-schema=knda_check

# 세션을 DB에 저장 (Cloud Run 인스턴스가 바뀌어도 로그인 유지)
spring.session.timeout=8h
server.servlet.session.cookie.max-age=3d
spring.session.jdbc.initialize-schema=never

# Cloud Run은 PORT 환경변수로 포트를 알려준다
server.port=${PORT:8080}

# Cloud Run 앞단의 HTTPS 프록시 헤더를 인식 (로그인 링크 생성 등에 필요)
server.forward-headers-strategy=framework

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.datasource.hikari.maximum-pool-size=5

app.mail.from=knda-check <no-reply@check.acfourd.it.kr>

# 배포할 때는 환경 변수 APP_BASE_URL로 실제 주소
app.base-url=http://localhost:8080