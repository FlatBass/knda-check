<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 로그인</title>
    <style>
        body { font-family: system-ui, "Malgun Gothic", sans-serif; background: #f5f6f8; margin: 0; padding: 16px; }
        .box { max-width: 340px; margin: 12vh auto 0; background: #fff; padding: 24px; border-radius: 12px;
               box-shadow: 0 1px 3px rgba(0,0,0,.12); }
        h1 { font-size: 18px; margin: 0 0 16px; }
        label { display: block; font-size: 13px; color: #555; margin: 12px 0 4px; }
        input { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #bbb; border-radius: 6px; font-size: 15px; }
        button { width: 100%; margin-top: 18px; padding: 10px; border: 0; border-radius: 6px; background: #1a73e8;
                 color: #fff; font-size: 15px; cursor: pointer; }
        .msg { padding: 8px 10px; border-radius: 6px; font-size: 13px; margin-bottom: 8px; }
        .err { background: #fde7e9; color: #a4262c; }
        .info { background: #e8f0fe; color: #174ea6; }
    </style>
</head>
<body>
<div class="box">
    <h1>관리자 로그인</h1>
    <p class="msg err" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
    <p class="msg err" th:if="${param.locked}">로그인 시도가 너무 많습니다. 10분 뒤에 다시 시도해 주세요.</p>
    <p class="msg info" th:if="${param.logout}">로그아웃되었습니다.</p>
    <form method="post" th:action="@{/login}">
        <label for="username">아이디</label>
        <input id="username" name="username" type="text" autocomplete="username" autofocus required>
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">로그인</button>
    </form>
</div>
</body>
</html>
